<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Neon Sakura</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- PRIVACY -->
<div id="privacy" class="screen">
  <div class="card">
    <h1>🌸 Privacy Policy</h1>
    <div class="text">
      <p>Мы сохраняем только игровой прогресс.</p>
      <ul>
        <li>Используется Telegram ID</li>
        <li>Личные данные не собираются</li>
        <li>Данные не передаются</li>
        <li>Можно удалить данные</li>
      </ul>
      <p>Нажимая кнопку ниже, вы соглашаетесь.</p>
    </div>
    <button onclick="accept()">Принять</button>
  </div>
</div>

<!-- GAME -->
<div id="game" class="screen hidden">
  <h2>🌸 Neon Sakura</h2>

  <div id="tap-circle" onclick="tap()">TAP</div>

  <div class="info">
    <p id="coins">Монеты: 0</p>
    <p id="level">Уровень: 1</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
