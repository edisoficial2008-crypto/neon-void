<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>NEON VOID — Energy Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>NEON VOID</h1>

  <div class="stats">
    <div>💰 <span id="coins">0</span></div>
    <div>⚡ <span id="energy">100</span>/<span id="maxEnergy">100</span></div>
  </div>

  <!-- ОРБ БЕЗ КВАДРАТА -->
  <div class="orb-container">
    <div id="orb"></div>
  </div>

  <div class="buttons">
    <button onclick="openShop()">🛒 Магазин</button>
    <button onclick="openProfile()">👤 Профиль</button>
    <button onclick="openLeaderboard()">🏆 Лидерборд</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
