<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEON VOID – Energy Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at 30% 20%, #6a00ff44, transparent 40%),
    radial-gradient(circle at 70% 80%, #ff00ff33, transparent 45%),
    linear-gradient(180deg, #0b0015, #1a0033);
  color: white;
  height: 100vh;
  overflow: hidden;
}

header {
  text-align: center;
  padding-top: 12px;
  font-size: 26px;
  font-weight: bold;
}

#score {
  text-align: center;
  opacity: 0.8;
  margin-top: 4px;
}

#tapArea {
  width: 220px;
  height: 220px;
  margin: 80px auto;
  border-radius: 50%;
  background: radial-gradient(circle, #ff4bff, #7a00cc);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  cursor: pointer;
  box-shadow: 0 0 50px #ff4bff;
  position: relative;
  user-select: none;
}

#tapArea:active {
  transform: scale(0.95);
}

.effect {
  position: absolute;
  color: #fff;
  font-size: 20px;
  animation: floatUp 1s ease-out forwards;
  pointer-events: none;
}

@keyframes floatUp {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(-60px); }
}

.ripple {
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid #fff;
  animation: ripple 0.6s ease-out forwards;
}

@keyframes ripple {
  from { transform: scale(1); opacity: 1; }
  to { transform: scale(8); opacity: 0; }
}

nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: rgba(0,0,0,0.7);
}

nav button {
  flex: 1;
  padding: 14px;
  font-size: 16px;
  background: none;
  color: white;
  border: none;
}

.screen {
  display: none;
  padding: 20px;
}

.screen.active {
  display: block;
}

.item {
  margin: 12px 0;
  padding: 12px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
}
</style>
</head>

<body>

<header>NEON VOID</header>
<div id="score">Очки: <span id="points">0</span></div>

<div id="game" class="screen active">
  <div id="tapArea">TAP</div>
</div>

<div id="shop" class="screen">
  <h2>🛒 Магазин</h2>
  <div class="item">
    +1 за тап — 50 очков
    <button onclick="buyUpgrade()">Купить</button>
  </div>
</div>

<div id="profile" class="screen">
  <h2>👤 Профиль</h2>
  <p>Очки: <span id="profilePoints">0</span></p>
  <p>Сила тапа: <span id="tapPower">1</span></p>
</div>

<div id="leaderboard" class="screen">
  <h2>🏆 Лидерборд</h2>
  <ol id="leaders"></ol>
</div>

<nav>
  <button onclick="openScreen('game')">🎮</button>
  <button onclick="openScreen('shop')">🛒</button>
  <button onclick="openScreen('profile')">👤</button>
  <button onclick="openScreen('leaderboard')">🏆</button>
</nav>

<script>
let points = parseInt(localStorage.getItem("points")) || 0;
let power = parseInt(localStorage.getItem("power")) || 1;

const pointsEl = document.getElementById("points");
const tapArea = document.getElementById("tapArea");

function save() {
  localStorage.setItem("points", points);
  localStorage.setItem("power", power);
}

function updateUI() {
  pointsEl.textContent = points;
  document.getElementById("profilePoints").textContent = points;
  document.getElementById("tapPower").textContent = power;
}

tapArea.onclick = (e) => {
  points += power;
  save();
  updateUI();

  // +число
  const text = document.createElement("div");
  text.className = "effect";
  text.textContent = "+" + power;
  text.style.left = "50%";
  text.style.top = "50%";
  tapArea.appendChild(text);
  setTimeout(() => text.remove(), 1000);

  // рябь
  const ripple = document.createElement("div");
  ripple.className = "ripple";
  ripple.style.left = e.offsetX + "px";
  ripple.style.top = e.offsetY + "px";
  tapArea.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
};

function buyUpgrade() {
  if (points >= 50) {
    points -= 50;
    power++;
    save();
    updateUI();
    alert("Апгрейд куплен!");
  } else alert("Не хватает очков");
}

function openScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(name).classList.add("active");
  if (name === "leaderboard") loadLeaders();
}

function loadLeaders() {
  let best = JSON.parse(localStorage.getItem("leaders")) || [];
  if (!best.includes(points)) {
    best.push(points);
    best.sort((a,b)=>b-a);
    best = best.slice(0,5);
    localStorage.setItem("leaders", JSON.stringify(best));
  }
  const list = document.getElementById("leaders");
  list.innerHTML = "";
  best.forEach(p => {
    const li = document.createElement("li");
    li.textContent = p + " очков";
    list.appendChild(li);
  });
}

updateUI();
</script>

</body>
</html>
