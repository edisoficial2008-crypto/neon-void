<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>NEON VOID</title>

<style>
body{
margin:0;
background:radial-gradient(circle,#120024,#000);
color:white;
font-family:Arial;
text-align:center;
}

#app{
max-width:420px;
margin:auto;
padding:10px;
}

/* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
}

.top-btn{
background:rgba(255,255,255,0.1);
border:none;
color:white;
padding:8px 12px;
border-radius:12px;
}

/* ===== ЭНЕРГИЯ ===== */
.energy{
background:rgba(255,255,255,0.08);
padding:10px;
border-radius:15px;
margin:10px 0;
}

/* ===== КРУГ ТАПА ===== */
#tapCircle{
width:180px;
height:180px;
border-radius:50%;
background:linear-gradient(45deg,#9b30ff,#ff00ff);
margin:30px auto;
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
font-weight:bold;
box-shadow:0 0 20px #ff00ff;
cursor:pointer;
}

/* ===== НИЖНЕЕ МЕНЮ ===== */
.bottom-menu{
position:fixed;
bottom:20px;
left:0;
right:0;
max-width:420px;
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
padding:10px;
}

.btn{
padding:12px;
border-radius:15px;
border:none;
color:white;
font-size:16px;
background:linear-gradient(90deg,#9b30ff,#ff00ff);
}

/* ===== КАРТОЧКИ ===== */
.card{
background:rgba(255,255,255,0.08);
border-radius:15px;
padding:12px;
margin:10px 0;
display:none;
}

.list-item{
background:rgba(255,255,255,0.1);
padding:8px;
border-radius:10px;
margin:5px 0;
}
</style>
</head>

<body>
<div id="app">

<div class="top-bar">
<button class="top-btn" onclick="tg.close()">❌ Закрыть</button>
<div>
<button class="top-btn" onclick="openTab('settings')">⚙️</button>
<button class="top-btn" onclick="toggleFull()">📱</button>
</div>
</div>

<div class="header">💜 NEON VOID</div>

<div class="energy">
⚡ Энергия: <span id="energy">4000</span>/4000  
<br> Восстановление офлайн каждые 30 мин
</div>

<div id="tapCircle">⚡ ТАП</div>

<div class="energy">
⭐ Очки: <span id="points">0</span>
</div>

<div class="bottom-menu">
<button class="btn" onclick="openTab('shop')">🛒 Магазин</button>
<button class="btn" onclick="openTab('profile')">👤 Профиль</button>
<button class="btn" onclick="openTab('leader')">🏆 Лидерборд</button>
</div>

<div id="leader" class="card">
<h3>🏆 Лидерборд</h3>
<div id="lbList">Загрузка...</div>
<button class="btn" onclick="refreshLB()">Обновить</button>
<button class="btn" onclick="closeAll()">Закрыть</button>
</div>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let energy = 4000;
let points = parseInt(localStorage.getItem("points")) || 0;
let boost = parseInt(localStorage.getItem("boost")) || 1;

const SERVER = "https://neon-void-4.onrender.com";

document.getElementById("points").innerText = points;

// ===== ТАП =====
document.getElementById("tapCircle").onclick = async () => {
if(energy > 0){
energy -= 1;
points += boost;

localStorage.setItem("points", points);
updateUI();
await sendScoreToServer();
}
};

// ===== ОТПРАВКА ОЧКОВ (важно для лидерборда) =====
async function sendScoreToServer(){
try{
await fetch(SERVER + "/save",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
id: tg.initDataUnsafe.user.id,
name: tg.initDataUnsafe.user.first_name,
score: points
})
});
console.log("Score sent:", points);
}catch(e){
console.log("Ошибка отправки — сервер мог спать");
}
}

// ===== ЛИДЕРБОРД — УНИВЕРСАЛЬНЫЙ ФИКС =====
async function refreshLB(){
let box = document.getElementById("lbList");
box.innerHTML = "Загрузка игроков...";

try{
let res = await fetch(SERVER + "/leaderboard");
let data = await res.json();

console.log("Ответ сервера:", data); // ← ВАЖНО

box.innerHTML = "";

if(!data || data.length === 0){
box.innerHTML = "<div class='list-item'>Пока нет игроков — будь первым!</div>";
return;
}

// Если сервер вдруг отдаёт объект, а не массив — превращаем в массив
if(!Array.isArray(data)){
data = Object.values(data);
}

data.slice(0,10).forEach((p,i)=>{
box.innerHTML += `
<div class="list-item">
#${i+1} ${p.name || "Игрок"} — ${p.score || 0} ⭐
</div>`;
});

}catch(e){
box.innerHTML = `
<div class="list-item">#1 Ты — ${points} ⭐</div>
<div class="list-item">#2 Игрок — 12000 ⭐</div>
<div class="list-item">#3 Игрок — 9000 ⭐</div>
<p style="font-size:12px;color:#aaa">
Сервер просыпается — обнови через 10 секунд
</p>
`;
}
}

// ===== UI =====
function updateUI(){
document.getElementById("energy").innerText = energy;
document.getElementById("points").innerText = points;
}

// ===== ВКЛАДКИ =====
function openTab(id){
closeAll();
document.getElementById(id).style.display="block";
if(id==="leader") refreshLB();
}

function closeAll(){
document.querySelectorAll(".card").forEach(c=>c.style.display="none");
}

// ===== ПОЛНЫЙ ЭКРАН =====
function toggleFull(){
tg.requestFullscreen();
}

updateUI();
refreshLB();
</script>

</body>
</html>
