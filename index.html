<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEON VOID</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>
<div id="app">

  <header>
    <h1>⚡ NEON VOID</h1>
    <p class="subtitle">Energy Tap Game</p>
  </header>

  <section class="stats">
    <div>⚡ Энергия<br><span id="energy">0</span></div>
    <div>💎 Кристаллы<br><span id="coins">0</span></div>
    <div>🚀 Сила<br><span id="power">1</span></div>
  </section>

  <button id="tapBtn">TAP ⚡</button>

  <section class="menu">
    <button onclick="openTab('shop')">🛒 Магазин</button>
    <button onclick="openTab('boost')">🔥 Бусты</button>
    <button onclick="openTab('profile')">👤 Профиль</button>
    <button onclick="openTab('settings')">⚙️</button>
  </section>

  <section id="shop" class="panel">
    <h2>🛒 Магазин</h2>
    <button onclick="buyPower()">➕ Сила (+1) — 20💎</button>
    <button onclick="buyOffline()">🕒 Оффлайн доход — 50💎</button>
  </section>

  <section id="boost" class="panel">
    <h2>🔥 Бусты</h2>
    <button onclick="activateBoost()">x2 TAP (30 сек) — 30💎</button>
    <p id="boostTimer"></p>
  </section>

  <section id="profile" class="panel">
    <h2>👤 Профиль</h2>
    <p>Всего тапов: <span id="taps">0</span></p>
    <p>Время в игре: <span id="time">0</span> сек</p>
  </section>

  <section id="settings" class="panel">
    <h2>⚙️ Настройки</h2>
    <button onclick="resetGame()">♻️ Сброс</button>
  </section>

</div>

<script src="script.js"></script>
</body>
  </html>
