<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEON VOID – Energy Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at center, #8f00ff, #120018);
  color: white;
  overflow: hidden;
}

header {
  text-align: center;
  padding: 10px;
  font-size: 24px;
  font-weight: bold;
}

#score {
  text-align: center;
  opacity: 0.8;
}

#tapArea {
  width: 200px;
  height: 200px;
  margin: 60px auto;
  border-radius: 50%;
  background: radial-gradient(circle, #ff4bff, #7a00cc);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  cursor: pointer;
  box-shadow: 0 0 40px #ff4bff;
}

nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: rgba(0,0,0,0.6);
}

nav button {
  flex: 1;
  padding: 15px;
  font-size: 16px;
  background: none;
  color: white;
  border: none;
}

.screen {
  display: none;
  padding: 20px;
}

.screen.active {
  display: block;
}

.item {
  margin: 10px 0;
  padding: 10px;
  background: rgba(255,255,255,0.1);
  border-radius: 8px;
}
</style>
</head>

<body>

<header>NEON VOID</header>
<div id="score">Очки: <span id="points">0</span></div>

<div id="game" class="screen active">
  <div id="tapArea">TAP</div>
</div>

<div id="shop" class="screen">
  <h2>🛒 Магазин</h2>
  <div class="item">
    +1 за тап — 50 очков
    <button onclick="buyUpgrade()">Купить</button>
  </div>
</div>

<div id="profile" class="screen">
  <h2>👤 Профиль</h2>
  <p>Очки: <span id="profilePoints">0</span></p>
  <p>Сила тапа: <span id="tapPower">1</span></p>
</div>

<div id="leaderboard" class="screen">
  <h2>🏆 Лидерборд</h2>
  <ol id="leaders"></ol>
</div>

<nav>
  <button onclick="openScreen('game')">🎮</button>
  <button onclick="openScreen('shop')">🛒</button>
  <button onclick="openScreen('profile')">👤</button>
  <button onclick="openScreen('leaderboard')">🏆</button>
</nav>

<script>
let points = parseInt(localStorage.getItem("points")) || 0;
let power = parseInt(localStorage.getItem("power")) || 1;

const pointsEl = document.getElementById("points");

function save() {
  localStorage.setItem("points", points);
  localStorage.setItem("power", power);
}

function updateUI() {
  pointsEl.textContent = points;
  document.getElementById("profilePoints").textContent = points;
  document.getElementById("tapPower").textContent = power;
}

document.getElementById("tapArea").onclick = () => {
  points += power;
  save();
  updateUI();
};

function buyUpgrade() {
  if (points >= 50) {
    points -= 50;
    power += 1;
    save();
    updateUI();
    alert("Апгрейд куплен!");
  } else {
    alert("Не хватает очков");
  }
}

function openScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(name).classList.add("active");

  if (name === "leaderboard") loadLeaders();
}

function loadLeaders() {
  let best = JSON.parse(localStorage.getItem("leaders")) || [];
  if (!best.includes(points)) {
    best.push(points);
    best.sort((a,b)=>b-a);
    best = best.slice(0,5);
    localStorage.setItem("leaders", JSON.stringify(best));
  }
  const list = document.getElementById("leaders");
  list.innerHTML = "";
  best.forEach(p => {
    const li = document.createElement("li");
    li.textContent = p + " очков";
    list.appendChild(li);
  });
}

updateUI();
</script>

</body>
  </html>
