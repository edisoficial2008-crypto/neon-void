<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>NEON VOID</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle, #120024, #000);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.header {
    padding-top: 20px;
    font-size: 22px;
    font-weight: bold;
}

.energy {
    margin-top: 10px;
}

.circle-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

.circle {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: linear-gradient(45deg, #ff00ff, #00ccff);
    box-shadow: 0 0 20px #ff00ff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
}

.menu {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 10px;
}

.btn {
    background: #ff00ff;
    border: none;
    padding: 12px;
    border-radius: 12px;
    color: white;
    font-size: 14px;
}

.screen {
    display: none;
    padding: 20px;
}

.settings select {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
💜 NEON VOID
</div>

<div class="energy" id="energyText">⚡ Энергия: 4000/4000</div>

<div class="circle-container">
<div class="circle" id="tapBtn">ТАП</div>
</div>

<!-- Экраны -->
<div id="shop" class="screen">🛒 Магазин (здесь будут покупки)</div>
<div id="profile" class="screen">👤 Профиль игрока</div>
<div id="leaderboard" class="screen">🏆 Лидерборд</div>

<div id="settings" class="screen settings">
<h3>⚙️ Настройки</h3>
<select id="langSelect">
<option value="ru">Русский</option>
<option value="uk">Українська</option>
<option value="en">English</option>
<option value="es">Español</option>
<option value="fr">Français</option>
<option value="de">Deutsch</option>
<option value="pt">Português</option>
<option value="tr">Türkçe</option>
<option value="ar">العربية</option>
<option value="zh">中文</option>
<option value="ja">日本語</option>
</select>
<br><br>
<button class="btn" onclick="closeAll()">Закрыть</button>
</div>

<!-- Нижнее меню -->
<div class="menu">
<button class="btn" onclick="openScreen('shop')" id="btnShop">Магазин</button>
<button class="btn" onclick="openScreen('profile')" id="btnProfile">Профиль</button>
<button class="btn" onclick="openScreen('leaderboard')" id="btnLb">Лидерборд</button>
<button class="btn" onclick="openScreen('settings')" id="btnSet">Настройки</button>
</div>

</div>

<script>
Telegram.WebApp.ready();

let maxEnergy = 4000;
let energy = 4000;
let lastRecover = Date.now();

const texts = {
ru: {
 shop:"Магазин",
 profile:"Профиль",
 lb:"Лидерборд",
 set:"Настройки",
 tap:"ТАП",
 energy:"⚡ Энергия:"
},
en: {
 shop:"Shop",
 profile:"Profile",
 lb:"Leaderboard",
 set:"Settings",
 tap:"TAP",
 energy:"⚡ Energy:"
},
uk: {
 shop:"Магазин",
 profile:"Профіль",
 lb:"Лідерборд",
 set:"Налаштування",
 tap:"ТАП",
 energy:"⚡ Енергія:"
},
es: {
 shop:"Tienda",
 profile:"Perfil",
 lb:"Clasificación",
 set:"Ajustes",
 tap:"TOCAR",
 energy:"⚡ Energía:"
},
fr: {
 shop:"Boutique",
 profile:"Profil",
 lb:"Classement",
 set:"Paramètres",
 tap:"TAPER",
 energy:"⚡ Énergie:"
},
de: {
 shop:"Shop",
 profile:"Profil",
 lb:"Rangliste",
 set:"Einstellungen",
 tap:"TIPPEN",
 energy:"⚡ Energie:"
},
pt: {
 shop:"Loja",
 profile:"Perfil",
 lb:"Ranking",
 set:"Configurações",
 tap:"TOCAR",
 energy:"⚡ Energia:"
},
tr: {
 shop:"Mağaza",
 profile:"Profil",
 lb:"Liderlik",
 set:"Ayarlar",
 tap:"DOKUN",
 energy:"⚡ Enerji:"
},
ar: {
 shop:"متجر",
 profile:"الملف",
 lb:"ترتيب",
 set:"إعدادات",
 tap:"اضغط",
 energy:"⚡ طاقة:"
},
zh: {
 shop:"商店",
 profile:"个人资料",
 lb:"排行榜",
 set:"设置",
 tap:"点击",
 energy:"⚡ 能量:"
},
ja: {
 shop:"ショップ",
 profile:"プロフィール",
 lb:"ランキング",
 set:"設定",
 tap:"タップ",
 energy:"⚡ エネルギー:"
}
};

function applyLang(lang){
localStorage.setItem("lang", lang);

document.getElementById("btnShop").innerText = texts[lang].shop;
document.getElementById("btnProfile").innerText = texts[lang].profile;
document.getElementById("btnLb").innerText = texts[lang].lb;
document.getElementById("btnSet").innerText = texts[lang].set;
document.getElementById("tapBtn").innerText = texts[lang].tap;
updateEnergy();
}

document.getElementById("langSelect").onchange = (e)=>{
applyLang(e.target.value);
};

function updateEnergy(){
let lang = localStorage.getItem("lang") || "ru";
document.getElementById("energyText").innerText =
texts[lang].energy + " " + energy + "/" + maxEnergy;
}

setInterval(()=>{
let now = Date.now();
let diff = now - lastRecover;

if(diff >= 30 * 60 * 1000 && energy < maxEnergy){
energy = Math.min(maxEnergy, energy + 500);
lastRecover = now;
updateEnergy();
}
}, 10000);

document.getElementById("tapBtn").onclick = ()=>{
if(energy > 0){
energy -= 1;
updateEnergy();
}
};

function openScreen(id){
document.querySelectorAll(".screen").forEach(s=>s.style.display="none");
document.getElementById(id).style.display="block";
}

function closeAll(){
document.querySelectorAll(".screen").forEach(s=>s.style.display="none");
}

applyLang(localStorage.getItem("lang") || "ru");
</script>

</body>
</html>
