<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON VOID</title>

<style>
* { box-sizing:border-box; user-select:none }
body {
  margin:0;
  background: radial-gradient(circle at top, #050b1a, #000);
  font-family: Arial, sans-serif;
  color:#fff;
  text-align:center;
}
h1 { margin:15px 0; letter-spacing:2px }
.stats { font-size:17px }
.buttons { display:flex; justify-content:center; gap:10px; margin:10px }
.btn {
  padding:10px 16px;
  border-radius:20px;
  border:none;
  cursor:pointer;
}
#tap {
  width:240px;height:240px;
  margin:60px auto;
  border-radius:50%;
  background: radial-gradient(circle at top,#5ee7ff,#1e90ff);
  box-shadow:0 0 40px #3fdcff,0 0 120px rgba(0,180,255,.8);
}
#tap:active{transform:scale(.94)}

.modal {
  position:fixed; inset:0;
  background:rgba(0,0,0,.8);
  display:none; justify-content:center; align-items:center;
}
.box {
  width:90%; max-width:420px;
  background:#0b1224;
  padding:20px; border-radius:20px;
  max-height:80vh; overflow:auto;
}
.close { float:right; cursor:pointer }
.item {
  background:#121b38;
  padding:12px; margin:10px 0;
  border-radius:14px; cursor:pointer;
}
</style>
</head>

<body>

<h1>NEON VOID</h1>
<div class="stats">
💰 <span id="coins">0</span> |
⚡ <span id="energy">0</span>/<span id="energyMax">4000</span>
</div>

<div class="buttons">
<button class="btn" onclick="open('shop')">🛒 Магазин</button>
<button class="btn" onclick="open('profile')">👤 Профиль</button>
</div>

<div id="tap" onclick="tap(event)"></div>

<!-- МАГАЗИН -->
<div class="modal" id="shop">
<div class="box">
<span class="close" onclick="close('shop')">✕</span>
<h3>Магазин</h3>

<div class="item" onclick="buyTap()">⚡ Сила тапа +1<br>Цена: <span id="tapPrice"></span></div>
<div class="item" onclick="buyEnergy()">🔋 Макс энергия +500<br>Цена: <span id="energyPrice"></span></div>

<hr>

<div class="item" onclick="buyAuto()">🤖 Автотап +1/сек<br>Цена: <span id="autoPrice"></span></div>
<div class="item" onclick="buyBonus()">💎 Бонус к тапу +10%<br>Цена: <span id="bonusPrice"></span></div>

<hr>

<div class="item" onclick="buyMulti()">🚀 Множитель x2<br>Цена: <span id="multiPrice"></span></div>
<div class="item" onclick="buyVIP()">👑 VIP CORE<br>Цена: <span id="vipPrice"></span></div>

</div>
</div>

<!-- ПРОФИЛЬ -->
<div class="modal" id="profile">
<div class="box">
<span class="close" onclick="close('profile')">✕</span>
<h3>Профиль</h3>
<p>Тапов: <span id="taps"></span></p>
<p>Сила тапа: <span id="tapPower"></span></p>
<p>Автотап: <span id="auto"></span>/сек</p>
<p>Бонус: <span id="bonus"></span>%</p>
<p>Множитель: x<span id="multi"></span></p>
</div>
</div>

<script>
let S = k => parseInt(localStorage.getItem(k))||0;
let coins=S("coins"), energyMax=S("energyMax")||4000, energy=S("energy")||energyMax;
let tapPower=S("tapPower")||1, taps=S("taps");
let auto=S("auto"), bonus=S("bonus"), multi=S("multi")||1, vip=S("vip");

let tapPrice=S("tapPrice")||100;
let energyPrice=S("energyPrice")||400;
let autoPrice=S("autoPrice")||5000;
let bonusPrice=S("bonusPrice")||15000;
let multiPrice=S("multiPrice")||100000;
let vipPrice=1000000;

function save(){
Object.assign(localStorage,{
coins,energy,energyMax,tapPower,taps,auto,bonus,multi,vip,
tapPrice,energyPrice,autoPrice,bonusPrice,multiPrice
})}

function upd(){
coins=Math.max(0,coins);
energy=Math.min(energy,energyMax);
["coins","energy","energyMax","tapPower","taps","auto","bonus","multi"]
.forEach(id=>document.getElementById(id).textContent=eval(id));
["tapPrice","energyPrice","autoPrice","bonusPrice","multiPrice","vipPrice"]
.forEach(id=>document.getElementById(id).textContent=eval(id));
}

function tap(e){
if(energy<=0)return;
let gain=Math.floor(tapPower*(1+bonus/100)*multi);
coins+=gain; energy--; taps++;
save(); upd();
}

function buyTap(){ if(coins<tapPrice)return;
coins-=tapPrice; tapPower++; tapPrice=Math.floor(tapPrice*1.7); save();upd();}
function buyEnergy(){ if(coins<energyPrice)return;
coins-=energyPrice; energyMax+=500; energy=energyMax;
energyPrice=Math.floor(energyPrice*1.8); save();upd();}
function buyAuto(){ if(coins<autoPrice)return;
coins-=autoPrice; auto++; autoPrice=Math.floor(autoPrice*2.2); save();upd();}
function buyBonus(){ if(coins<bonusPrice)return;
coins-=bonusPrice; bonus+=10; bonusPrice=Math.floor(bonusPrice*2.5); save();upd();}
function buyMulti(){ if(multi>=2||coins<multiPrice)return;
coins-=multiPrice; multi=2; save();upd();}
function buyVIP(){ if(vip||coins<vipPrice)return;
coins-=vipPrice; vip=1; multi=3; auto+=5; save();upd();}

setInterval(()=>{
coins+=auto*Math.max(1,multi);
if(energy<energyMax)energy++;
save(); upd();
},1000);

function open(id){document.getElementById(id).style.display="flex"}
function close(id){document.getElementById(id).style.display="none"}

upd();
</script>

</body>
</html>
