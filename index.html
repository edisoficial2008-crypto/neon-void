<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>NEON VOID — Energy Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top">
  <h1>NEON VOID</h1>
  <div class="stats">
    💰 <span id="coins">0</span>
    ⚡ <span id="energy">0</span>/<span id="maxEnergy">4000</span>
  </div>
</div>

<div class="buttons">
  <button onclick="openWindow('shop')">🛒 Магазин</button>
  <button onclick="openWindow('profile')">👤 Профиль</button>
  <button onclick="openWindow('leaderboard')">🏆 Лидерборд</button>
</div>

<div class="tap-area">
  <div id="tapCircle"></div>
</div>

<!-- ОКНА -->
<div class="window" id="shop">
  <div class="window-content">
    <span class="close" onclick="closeWindow()">✖</span>
    <h2>Магазин</h2>
    <button onclick="buyUpgrade()">+1 к тапу (1000💰)</button>
  </div>
</div>

<div class="window" id="profile">
  <div class="window-content">
    <span class="close" onclick="closeWindow()">✖</span>
    <h2>Профиль</h2>
    <p>Тапов: <span id="taps">0</span></p>
    <p>Сила тапа: <span id="tapPower">1</span></p>
  </div>
</div>

<div class="window" id="leaderboard">
  <div class="window-content">
    <span class="close" onclick="closeWindow()">✖</span>
    <h2>Лидерборд</h2>
    <p>Скоро...</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
