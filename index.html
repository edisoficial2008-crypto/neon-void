<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>NEON VOID</title>

<style>
body {
 margin: 0;
 background: radial-gradient(circle, #120024, #000);
 color: white;
 font-family: Arial, sans-serif;
 text-align: center;
}

.container {
 max-width: 420px;
 margin: auto;
 padding: 15px;
}

.card {
 background: rgba(255,255,255,0.08);
 border-radius: 15px;
 padding: 12px;
 margin: 10px 0;
 backdrop-filter: blur(8px);
}

.btn {
 background: linear-gradient(90deg,#9b5cff,#ff4fff);
 color:white;
 border:none;
 padding:12px;
 border-radius:12px;
 width:100%;
 font-size:16px;
}

.flex {
 display:flex;
 gap:10px;
}

.leader-item {
 display:flex;
 justify-content:space-between;
 background:rgba(255,255,255,0.1);
 padding:8px;
 border-radius:8px;
 margin:5px 0;
}

.hidden { display:none; }
</style>
</head>

<body>

<div class="container">

<h2>💜 NEON VOID</h2>

<div class="card">
<h3>⚡ Энергия: <span id="energy">4000</span>/4000</h3>
<button class="btn" onclick="tap()">⚡ ТАП</button>
</div>

<div class="card">
<h3>⭐ Очки: <span id="points">0</span></h3>
</div>

<div class="flex">
<button class="btn" onclick="showShop()">🛒 Магазин</button>
<button class="btn" onclick="showProfile()">👤 Профиль</button>
</div>

<button class="btn" onclick="showLeaderboard()">🏆 Лидерборд</button>
<button class="btn" onclick="toggleFull()">📱 Полный экран</button>

<!-- МАГАЗИН -->
<div id="shop" class="card hidden">
<h3>🛒 Магазин</h3>
<button class="btn" onclick="buyBoost(1)">⚡ +5 энергия/сек (500 очков)</button>
<button class="btn" onclick="buyBoost(2)">🔥 +10 энергия/сек (1500 очков)</button>
<button class="btn" onclick="buyBoost(3)">🌌 +25 энергия/сек (5000 очков)</button>
<button class="btn" onclick="hideAll()">Закрыть</button>
</div>

<!-- ПРОФИЛЬ -->
<div id="profile" class="card hidden">
<h3>👤 Профиль</h3>
<p>ID: <span id="pid"></span></p>
<p>Имя: <span id="pname"></span></p>
<p>Очки: <span id="ppoints"></span></p>
<p>Энергия: <span id="penergy"></span></p>
<button class="btn" onclick="hideAll()">Закрыть</button>
</div>

<!-- ЛИДЕРБОРД -->
<div id="leaders" class="card hidden">
<h3>🏆 Топ игроков</h3>
<div id="leaderList"></div>
<button class="btn" onclick="hideAll()">Закрыть</button>
</div>

</div>

<script>
Telegram.WebApp.ready();

const SERVER = "https://neon-void-4.onrender.com";

let user = Telegram.WebApp.initDataUnsafe.user;
let uid = user.id;
let name = user.first_name;

document.getElementById("pid").innerText = uid;
document.getElementById("pname").innerText = name;

let points = 0;
let energy = 4000;
let regen = 2; // энергия в секунду

// ТАП
function tap(){
 if(energy > 0){
   points += 1;
   energy -= 1;
   updateUI();
 }
}

// Офлайн восстановление энергии
setInterval(()=>{
 if(energy < 4000) energy += regen;
 if(energy > 4000) energy = 4000;
 updateUI();
},1000);

// Автосохранение на сервер
setInterval(()=>{
 fetch(`${SERVER}/save/${uid}/${points}/${energy}/${encodeURIComponent(name)}`);
},5000);

function updateUI(){
 document.getElementById("points").innerText = points;
 document.getElementById("energy").innerText = energy;
 document.getElementById("ppoints").innerText = points;
 document.getElementById("penergy").innerText = energy;
}

// Магазин
function buyBoost(type){
 if(type==1 && points>=500){
   points-=500; regen+=1;
 }
 if(type==2 && points>=1500){
   points-=1500; regen+=2;
 }
 if(type==3 && points>=5000){
   points-=5000; regen+=5;
 }
 updateUI();
}

// Лидерборд
async function showLeaderboard(){
 hideAll();
 document.getElementById("leaders").classList.remove("hidden");

 let res = await fetch(`${SERVER}/leaders`);
 let data = await res.json();

 let html="";
 data.forEach((p,i)=>{
   html+=`<div class='leader-item'>
     <span>${i+1}. ${p.name}</span>
     <span>${p.points} ⭐</span>
   </div>`;
 });

 document.getElementById("leaderList").innerHTML = html;
}

// Показ окон
function showShop(){
 hideAll(); document.getElementById("shop").classList.remove("hidden");
}
function showProfile(){
 hideAll(); document.getElementById("profile").classList.remove("hidden");
}
function hideAll(){
 document.getElementById("shop").classList.add("hidden");
 document.getElementById("profile").classList.add("hidden");
 document.getElementById("leaders").classList.add("hidden");
}

// Полный экран
function toggleFull(){
 Telegram.WebApp.requestFullscreen();
}
</script>

</body>
</html>
