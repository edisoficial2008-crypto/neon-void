<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON VOID</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #0b0f1a;
color: white;
text-align: center;
}

.header {
padding: 15px;
font-size: 22px;
font-weight: bold;
}

.energy {
margin: 10px;
font-size: 18px;
}

.circle {
width: 220px;
height: 220px;
border-radius: 50%;
background: radial-gradient(circle, #ff00ff, #7a00ff);
margin: 20px auto;
display: flex;
align-items: center;
justify-content: center;
font-size: 28px;
font-weight: bold;
box-shadow: 0 0 20px #ff00ff;
cursor: pointer;
}

.score {
margin: 15px;
font-size: 18px;
}

.bottom {
position: fixed;
bottom: 0;
width: 100%;
display: flex;
justify-content: space-around;
padding: 10px;
background: #121622;
}

.btn {
padding: 10px 15px;
border: none;
border-radius: 10px;
background: linear-gradient(90deg, #ff00ff, #7a00ff);
color: white;
font-weight: bold;
cursor: pointer;
}

.screen {
display: none;
padding: 20px;
}

.shop-item {
background: #1a1f2b;
padding: 10px;
margin: 10px;
border-radius: 10px;
}
</style>
</head>

<body>

<div class="header">💜 NEON VOID</div>

<div class="energy">⚡ Энергия: <span id="energy">4000</span>/4000</div>

<div class="circle" onclick="tap()">⚡ ТАП</div>

<div class="score">⭐ Очки: <span id="score">0</span></div>

<!-- Экраны -->
<div id="shop" class="screen">
<h3>🛒 Магазин</h3>

<div class="shop-item">
💥 Буст +1 к тапу — цена: 100 ⭐  
<button class="btn" onclick="buyTap(100)">Купить</button>
</div>

<div class="shop-item">
⚡ +500 к макс энергии — цена: 300 ⭐  
<button class="btn" onclick="buyEnergy(300)">Купить</button>
</div>

<div class="shop-item">
⏱️ Быстрее реген — цена: 500 ⭐  
<button class="btn" onclick="buyRegen(500)">Купить</button>
</div>

<button class="btn" onclick="closeAll()">Закрыть</button>
</div>

<div id="profile" class="screen">
<h3>👤 Профиль</h3>
<div id="pinfo"></div>
<button class="btn" onclick="closeAll()">Закрыть</button>
</div>

<div id="leaderboard" class="screen">
<h3>🏆 Лидерборд</h3>
<div id="lbList">Загрузка...</div>
<button class="btn" onclick="closeAll()">Закрыть</button>
</div>

<div id="settings" class="screen">
<h3>⚙️ Настройки</h3>
<button class="btn" onclick="setLang('ru')">Русский</button>
<button class="btn" onclick="setLang('en')">English</button>
<button class="btn" onclick="setLang('uk')">Українська</button>
<br><br>
<button class="btn" onclick="closeAll()">Закрыть</button>
</div>

<!-- Нижнее меню -->
<div class="bottom">
<button class="btn" onclick="openScreen('shop')">🛒 Магазин</button>
<button class="btn" onclick="openScreen('profile')">👤 Профиль</button>
<button class="btn" onclick="openScreen('leaderboard')">🏆 Топ</button>
<button class="btn" onclick="openScreen('settings')">⚙️ Настройки</button>
</div>

<script>
Telegram.WebApp.ready();

const SERVER = "https://neon-void-4.onrender.com";

let maxEnergy = 4000;
let energy = 4000;
let score = 0;
let tapPower = 1;
let regenSpeed = 1800; // 30 минут до фула

function tap(){
if(energy > 0){
energy -= 1;
score += tapPower;
updateUI();
sendScore();
}
}

function updateUI(){
document.getElementById("energy").innerText = energy;
document.getElementById("score").innerText = score;
document.getElementById("pinfo").innerHTML =
`ID: ${Telegram.WebApp.initDataUnsafe.user.id}<br>
Имя: ${Telegram.WebApp.initDataUnsafe.user.first_name}<br>
Очки: ${score}<br>
Сила тапа: ${tapPower}<br>
Макс энергия: ${maxEnergy}`;
}

function regen(){
if(energy < maxEnergy){
energy += 1;
updateUI();
}
}
setInterval(regen, regenSpeed / maxEnergy * 1000);

function buyTap(price){
if(score >= price){
score -= price;
tapPower += 1;
updateUI();
}
}

function buyEnergy(price){
if(score >= price){
score -= price;
maxEnergy += 500;
energy = maxEnergy;
updateUI();
}
}

function buyRegen(price){
if(score >= price){
score -= price;
regenSpeed -= 300;
updateUI();
}
}

function openScreen(id){
closeAll();
document.getElementById(id).style.display = "block";
if(id === "leaderboard") loadLeaderboard();
}

function closeAll(){
document.querySelectorAll(".screen").forEach(e=>e.style.display="none");
}

// Лидерборд
async function sendScore(){
fetch(SERVER + "/save_score", {
method: "POST",
headers: {"Content-Type": "application/json"},
body: JSON.stringify({
user_id: Telegram.WebApp.initDataUnsafe.user.id,
username: Telegram.WebApp.initDataUnsafe.user.first_name,
score: score
})
});
}

async function loadLeaderboard(){
let res = await fetch(SERVER + "/leaderboard");
let data = await res.json();

let html = "";
data.forEach(p=>{
html += `#${p.place} ${p.name} — ${p.score} ⭐<br>`;
});

document.getElementById("lbList").innerHTML = html;
}

// Языки (упрощённо)
function setLang(l){
alert("Язык сменён на: " + l);
}

updateUI();
</script>

</body>
</html>
