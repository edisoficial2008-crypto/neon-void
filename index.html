<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON VOID</title>

<style>
body {
    margin: 0;
    background: #0b1020;
    color: white;
    font-family: Arial;
    text-align: center;
}

header {
    padding: 15px;
    font-size: 22px;
}

.top-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 10px;
}

button {
    padding: 10px 15px;
    border-radius: 20px;
    border: none;
    font-size: 16px;
}

#tapCircle {
    width: 260px;
    height: 260px;
    margin: 20px auto;
    background: radial-gradient(circle, #2fbaff, #0a7cff);
    border-radius: 50%;
    box-shadow: 0 0 25px #2fbaff;
    transition: transform .1s;
}

#tapCircle:active {
    transform: scale(0.95);
}

.panel {
    display: none;
    background: #111;
    padding: 15px;
    margin: 10px;
    border-radius: 12px;
}

.close {
    float: right;
    color: red;
    font-size: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<header>
NEON VOID — Energy Game
<div class="top-bar">
💰 <span id="coins">0</span> | ⚡ <span id="energy">100/100</span>
</div>

<button onclick="openShop()">🛒 Магазин</button>
<button onclick="openProfile()">👤 Профиль</button>
<button onclick="openLeaders()">🏆 Лидерборд</button>
</header>

<div id="tapCircle" onclick="tap()"></div>

<!-- МАГАЗИН -->
<div id="shop" class="panel">
<span class="close" onclick="closeAll()">✖</span>
<h3>Магазин</h3>
<button onclick="buyBoost(1)">x2 на 1 час — 500💰</button><br><br>
<button onclick="buyBoost(2)">+50 энергии — 800💰</button><br><br>
<button onclick="buyBoost(3)">x3 на 6 часов — 5000💰</button>
</div>

<!-- ПРОФИЛЬ -->
<div id="profile" class="panel">
<span class="close" onclick="closeAll()">✖</span>
<h3>Профиль</h3>
<p id="profileInfo"></p>
</div>

<!-- ЛИДЕРБОРД -->
<div id="leaders" class="panel">
<span class="close" onclick="closeAll()">✖</span>
<h3>Топ игроков</h3>
<div id="leaderList">Загрузка...</div>
</div>

<script>
const SERVER = "https://neon-void-4.onrender.com";
const userId = "user_" + Math.floor(Math.random()*999999);

let coins = 0;
let energy = 100;
let maxEnergy = 100;

// регистрация
fetch(SERVER + "/register", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({userId, username:"Игрок"})
});

// ТАП
function tap(){
    if(energy <= 0) return;

    coins += 1;
    energy -= 1;

    updateUI();
    saveProgress();
}

// СОХРАНЕНИЕ
function saveProgress(){
    fetch(SERVER + "/save", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({userId, coins, energy})
    });
}

// ОФЛАЙН ВОССТАНОВЛЕНИЕ КАЖДЫЕ 30 сек
setInterval(()=>{
    fetch(SERVER + "/profile/" + userId)
    .then(r=>r.json())
    .then(d=>{
        energy = d.energy;
        maxEnergy = d.maxEnergy;
        coins = d.coins;
        updateUI();
    });
}, 30000);

function updateUI(){
    document.getElementById("coins").innerText = coins;
    document.getElementById("energy").innerText = energy + "/" + maxEnergy;
}

// ПАНЕЛИ
function openShop(){
 closeAll();
 document.getElementById("shop").style.display="block";
}

function openProfile(){
 closeAll();
 fetch(SERVER + "/profile/" + userId)
 .then(r=>r.json())
 .then(d=>{
   document.getElementById("profileInfo").innerHTML =
   `Имя: ${d.username}<br>Монеты: ${d.coins}<br>Энергия: ${d.energy}/${d.maxEnergy}`;
 });
 document.getElementById("profile").style.display="block";
}

function openLeaders(){
 closeAll();
 document.getElementById("leaders").style.display="block";

 fetch(SERVER + "/leaderboard")
 .then(r=>r.json())
 .then(list=>{
   let html = "";
   list.forEach((p,i)=>{
     html += `<b>${i+1}.</b> ${p.username} — ${p.coins}💰<br>`;
   });
   document.getElementById("leaderList").innerHTML = html;
 });
}

function closeAll(){
 document.getElementById("shop").style.display="none";
 document.getElementById("profile").style.display="none";
 document.getElementById("leaders").style.display="none";
}

// БУСТЫ
function buyBoost(type){
 if(type===1 && coins>=500){
   coins -= 500;
 } else if(type===2 && coins>=800){
   coins -= 800;
   energy = Math.min(maxEnergy, energy+50);
 } else if(type===3 && coins>=5000){
   coins -= 5000;
 }
 updateUI();
 saveProgress();
}
</script>

</body>
</html>
