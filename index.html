<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Anime Tap World</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="privacy" class="overlay">
  <div class="card">
    <h2>🔒 Конфиденциальность</h2>
    <p>Прогресс сохраняется локально</p>
    <button onclick="acceptPrivacy()">Принять</button>
  </div>
</div>

<div id="app" class="app hidden">

  <div class="top">
    💰 <span id="coins">0</span>
    ⚡ <span id="power">1</span>
    ⏱ <span id="buff">—</span>
  </div>

  <div class="tap-zone">
    <div id="tap-circle" onclick="tap()">TAP</div>
  </div>

  <div class="menu">
    <button onclick="openTab('shop')">🛒</button>
    <button onclick="openTab('profile')">👤</button>
    <button onclick="openTab('leader')">🏆</button>
  </div>

  <div id="shop" class="panel hidden">
    <h3>🛒 Магазин</h3>

    <h4>⚡ Улучшения</h4>
    <button onclick="buy('p1', 10)">+1 к тапу — 10</button>
    <button onclick="buy('p2', 50)">+2 к тапу — 50</button>
    <button onclick="buy('p5', 250)">+5 к тапу — 250</button>

    <h4>⏱ Временные бусты</h4>
    <button onclick="buyTemp(2, 100, 30)">x2 — 30 сек (100)</button>
    <button onclick="buyTemp(5, 500, 60)">x5 — 1 мин (500)</button>
    <button onclick="buyTemp(10, 2000, 120)">x10 — 2 мин (2K)</button>

    <h4>🤖 Авто</h4>
    <button onclick="buy('auto', 5000)">Автотап — 5K</button>

    <h4>🔥 Продвинутые</h4>
    <button onclick="buy('x2', 20000)">x2 навсегда — 20K</button>
    <button onclick="buy('x5', 100000)">x5 навсегда — 100K</button>
  </div>

  <div id="profile" class="panel hidden">
    <h3>👤 Профиль</h3>
    <p>ID: <span id="pid"></span></p>
    <p>Монеты: <span id="pCoins"></span></p>
    <p>Сила тапа: <span id="pPower"></span></p>
    <p>Всего тапов: <span id="pTaps"></span></p>
    <p>Автотап: <span id="pAuto"></span></p>
    <p>Буст: <span id="pBuff"></span></p>
    <p>В игре: <span id="pTime"></span></p>
  </div>

  <div id="leader" class="panel hidden">
    <h3>🏆 Лидерборд</h3>
    <p>Появится позже</p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
