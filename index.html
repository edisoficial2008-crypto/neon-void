<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>NEON VOID</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle, #120024, #000);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 420px;
    margin: auto;
    padding: 15px;
}

.header {
    font-size: 22px;
    font-weight: bold;
    color: #9b5cff;
}

.card {
    background: rgba(255,255,255,0.08);
    border-radius: 15px;
    padding: 12px;
    margin: 10px 0;
    backdrop-filter: blur(8px);
}

.energy-bar {
    width: 100%;
    height: 14px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
}

.energy-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #9b5cff, #ff4cff);
    transition: width 0.5s;
}

.big-button {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle, #9b5cff, #4a00e0);
    color: white;
    font-size: 22px;
    box-shadow: 0 0 25px #9b5cff;
    margin: 20px auto;
    display: block;
}

.menu {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}

.menu button {
    background: #1a0033;
    color: white;
    border: 1px solid #9b5cff;
    border-radius: 12px;
    padding: 8px 12px;
}

.screen {
    display: none;
}

.active {
    display: block;
}
</style>
</head>

<body>

<div class="container">

<div class="header">⚡ NEON VOID ⚡</div>

<div class="card">
Очки: <span id="points">0</span>
</div>

<div class="card">
Энергия: <span id="energy">4000</span>/4000  
<div class="energy-bar">
<div class="energy-fill" id="energyBar"></div>
</div>
</div>

<button class="big-button" onclick="tap()">ТАП</button>

<div class="menu">
<button onclick="show('main')">Главная</button>
<button onclick="show('shop')">Магазин</button>
<button onclick="show('profile')">Профиль</button>
<button onclick="show('leaders')">Лидеры</button>
</div>

<div id="main" class="screen active">
<h3>🏠 Главная</h3>
<p>Тапай, качайся и доминируй.</p>
</div>

<div id="shop" class="screen">
<h3>🛒 Магазин</h3>
<div class="card">💎 Буст х2 — 50,000 очков</div>
<div class="card">⚡ +200 энергии — 80,000 очков</div>
<div class="card">🚀 Автотап — 250,000 очков</div>
<div class="card">🌌 Премиум — 1,000,000 очков</div>
<div class="card">🛡 Легендарный буст — 5,000,000 очков</div>
</div>

<div id="profile" class="screen">
<h3>👤 Профиль</h3>
<div class="card">Имя: <span id="username"></span></div>
<div class="card">ID: <span id="userid"></span></div>
<div class="card">Уровень: 1</div>
<div class="card">Ранг: Новичок</div>
<button onclick="fullscreen()">🔲 Полный экран</button>
</div>

<div id="leaders" class="screen">
<h3>🏆 Лидерборд</h3>
<div id="leaderList"></div>
<button onclick="loadLeaders()">🔄 Обновить лидеров</button>
</div>

</div>

<script>
Telegram.WebApp.ready();

const SERVER = "https://neon-void-4.onrender.com";

let points = 0;
let energy = 4000;
const maxEnergy = 4000;

document.getElementById("username").innerText =
Telegram.WebApp.initDataUnsafe.user.first_name;

document.getElementById("userid").innerText =
Telegram.WebApp.initDataUnsafe.user.id;

function tap(){
 if(energy > 0){
  points += 10;
  energy -= 1;
  updateUI();
 }
}

function updateUI(){
 document.getElementById("points").innerText = points;
 document.getElementById("energy").innerText = energy;
 document.getElementById("energyBar").style.width =
 (energy / maxEnergy * 100) + "%";
}

// офлайн/онлайн восстановление (30 минут до фула)
setInterval(()=>{
 if(energy < maxEnergy){
  energy += 1;
  updateUI();
 }
}, 45000);

// сохраняем прогресс каждые 5 секунд
setInterval(()=>{
 fetch(`${SERVER}/save/${Telegram.WebApp.initDataUnsafe.user.id}/${points}/${energy}`);
}, 5000);

// загружаем прогресс при входе
fetch(`${SERVER}/get/${Telegram.WebApp.initDataUnsafe.user.id}`)
.then(r=>r.json())
.then(data=>{
 points = data.points;
 energy = data.energy;
 updateUI();
});

// лидерборд
function loadLeaders(){
 fetch(`${SERVER}/leaders`)
 .then(r=>r.json())
 .then(data=>{
   let html = "";
   data.forEach(p=>{
     html += `<div class="card">#${p.rank} | ID: ${p.user_id} — ${p.points} очков</div>`;
   });
   document.getElementById("leaderList").innerHTML = html;
 });
}

function show(id){
 document.querySelectorAll(".screen").forEach(el=>el.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

function fullscreen(){
 Telegram.WebApp.requestFullscreen();
}
</script>

</body>
    </html>
