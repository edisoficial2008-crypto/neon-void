<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Neon Void</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="privacy-screen">
  <h2>🔐 Политика конфиденциальности</h2>
  <p>
    Используя это приложение, вы соглашаетесь со следующим:
    <br><br>
    • Сохраняется только игровой прогресс<br>
    • Используется только Telegram ID<br>
    • Личные данные не собираются<br>
    • Данные не передаются третьим лицам<br>
    • Вы можете удалить данные в любой момент
  </p>

  <button onclick="acceptPrivacy()">✅ Принять</button>
</div>

<div id="game-screen" style="display:none;">
  <h1>🎮 Neon Void</h1>
  <div id="tap-circle" onclick="tap()">TAP</div>
  <p id="coins">Монеты: 0</p>
</div>

<script src="script.js"></script>
</body>
</html>
