<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NEON VOID</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <div class="title">NEON VOID</div>
  <div class="stats">
    Очки: <span id="points">124</span> |
    Энергия: <span id="energy">3963</span>/4000
  </div>
</div>

<div id="tapZone"></div>

<div class="bottom-menu">
  <button onclick="openModal('shop')">🛒</button>
  <button onclick="openModal('profile')">👤</button>
  <button onclick="openModal('leaderboard')">🏆</button>
</div>

<!-- МОДАЛКИ -->
<div class="modal" id="shop">
  <div class="modal-box">
    <span class="close" onclick="closeModal()">✕</span>
    <h2>Магазин</h2>
    <p>Скоро апгрейды как у Notcoin</p>
  </div>
</div>

<div class="modal" id="profile">
  <div class="modal-box">
    <span class="close" onclick="closeModal()">✕</span>
    <h2>Профиль</h2>
    <p>Очки, энергия, уровень</p>
  </div>
</div>

<div class="modal" id="leaderboard">
  <div class="modal-box">
    <span class="close" onclick="closeModal()">✕</span>
    <h2>Лидерборд</h2>
    <p>Топ игроков</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
