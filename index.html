<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Anime Tap</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;overflow:hidden;background:#12001f;color:#fff}

/* ===== ФОН ===== */
.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top,#4b006e,#12001f 70%);
  z-index:0;
}

/* ===== ЧАСТИЦЫ ===== */
.particle{
  position:absolute;
  width:6px;
  height:6px;
  background:#ff7bff;
  border-radius:50%;
  opacity:.6;
  animation:float linear infinite;
}

@keyframes float{
  from{transform:translateY(110vh)}
  to{transform:translateY(-10vh)}
}

/* ===== ОСНОВА ===== */
#app{
  position:relative;
  z-index:2;
  height:100vh;
}

/* ===== ВЕРХ ===== */
.top{
  display:flex;
  justify-content:space-between;
  padding:14px 18px;
  font-size:18px;
}

/* ===== ТАП КРУГ ===== */
.tap-core{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:240px;
  height:240px;
  border-radius:50%;
  background:
    radial-gradient(circle at top,#ff6bff,#6a00a8);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
  text-shadow:0 0 12px #fff;
  box-shadow:
    0 0 40px #ff6bffaa,
    inset 0 0 30px #ffffff33;
  animation:pulse 2s infinite;
}

.tap-core:active{
  transform:translate(-50%,-50%) scale(.95);
}

@keyframes pulse{
  0%{box-shadow:0 0 25px #ff6bff66}
  50%{box-shadow:0 0 60px #ff6bffff}
  100%{box-shadow:0 0 25px #ff6bff66}
}

/* ===== НИЗ ===== */
.bottom{
  position:absolute;
  bottom:14px;
  width:100%;
  display:flex;
  justify-content:space-around;
}

.btn{
  background:rgba(0,0,0,.55);
  padding:12px 20px;
  border-radius:16px;
  backdrop-filter:blur(6px);
}

/* ===== МОДАЛКИ ===== */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  z-index:5;
}

.modal-content{
  background:#1b002b;
  margin:40px 18px;
  padding:20px;
  border-radius:18px;
}

.close{
  position:absolute;
  right:18px;
  top:10px;
  font-size:22px;
}

.item{
  background:#2b0042;
  margin:12px 0;
  padding:14px;
  border-radius:14px;
}

/* ===== КОНФИДЕНЦ ===== */
.privacy{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}

.privacy-box{
  background:#1b002b;
  padding:26px;
  border-radius:18px;
  text-align:center;
}

button{
  margin-top:14px;
  padding:10px 22px;
  border-radius:14px;
  border:none;
}
</style>
</head>

<body>
<div class="bg"></div>

<!-- ЧАСТИЦЫ -->
<script>
for(let i=0;i<40;i++){
  let p=document.createElement("div");
  p.className="particle";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(5+Math.random()*10)+"s";
  p.style.opacity=Math.random();
  document.body.appendChild(p);
}
</script>

<!-- КОНФИДЕНЦ -->
<div class="privacy" id="privacy">
  <div class="privacy-box">
    <h2>🔒 Конфиденциальность</h2>
    <p>Прогресс сохраняется</p>
    <button onclick="accept()">Принять</button>
  </div>
</div>

<div id="app">
  <div class="top">
    <div>💰 <span id="coins">0</span></div>
    <div>⚡ <span id="power">1</span></div>
  </div>

  <div class="tap-core" onclick="tap()">TAP</div>

  <div class="bottom">
    <div class="btn" onclick="openM('shop')">🛒</div>
    <div class="btn" onclick="openM('profile')">👤</div>
    <div class="btn" onclick="openM('lead')">🏆</div>
  </div>
</div>

<div class="modal" id="shop">
  <div class="modal-content">
    <div class="close" onclick="closeM()">✖</div>
    <h2>Магазин</h2>
    <div class="item">+1 сила — 50 <button onclick="buy(1,50)">Купить</button></div>
    <div class="item">x2 (5 мин) — 150 <button onclick="boost()">Купить</button></div>
  </div>
</div>

<div class="modal" id="profile">
  <div class="modal-content">
    <div class="close" onclick="closeM()">✖</div>
    <h2>Профиль</h2>
    <p>Тапов: <span id="taps"></span></p>
    <p>Сила: <span id="pp"></span></p>
    <p>Монеты: <span id="pc"></span></p>
  </div>
</div>

<div class="modal" id="lead">
  <div class="modal-content">
    <div class="close" onclick="closeM()">✖</div>
    <h2>Лидерборд</h2>
    <p>Ты: <span id="lc"></span> 💰</p>
  </div>
</div>

<script>
const tg=window.Telegram.WebApp; tg.expand();
let d=JSON.parse(localStorage.getItem("animeTap"))||{c:0,p:1,t:0,b:0};
function save(){localStorage.setItem("animeTap",JSON.stringify(d))}
function upd(){
  coins.innerText=d.c;
  power.innerText=d.p;
  taps.innerText=d.t;
  pp.innerText=d.p;
  pc.innerText=d.c;
  lc.innerText=d.c;
}
function tap(){
  let m=Date.now()<d.b?2:1;
  d.c+=d.p*m; d.t++; save(); upd();
}
function buy(p,c){if(d.c>=c){d.c-=c;d.p+=p;save();upd()}}
function boost(){if(d.c>=150){d.c-=150;d.b=Date.now()+300000;save();upd()}}
function openM(id){document.getElementById(id).style.display="block"}
function closeM(){document.querySelectorAll(".modal").forEach(m=>m.style.display="none")}
function accept(){localStorage.setItem("ok","1");privacy.style.display="none"}
if(localStorage.getItem("ok"))privacy.style.display="none";
upd();
</script>
</body>
</html>
