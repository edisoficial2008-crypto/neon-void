<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Anime Tap World</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="privacy" class="overlay">
  <div class="card">
    <h2>🔒 Конфиденциальность</h2>
    <p>Прогресс сохраняется</p>
    <button onclick="acceptPrivacy()">Принять</button>
  </div>
</div>

<div id="app" class="app hidden">

  <div class="top">
    💰 <span id="coins">0</span> |
    ⚡ <span id="power">1</span> |
    ⏱ <span id="buff">—</span>
  </div>

  <div class="tap-zone">
    <div id="tap-circle" onclick="tap()">TAP</div>
  </div>

  <div class="menu">
    <button onclick="openTab('shop')">🛒 Магазин</button>
    <button onclick="openTab('profile')">👤 Профиль</button>
    <button onclick="openTab('leader')">🏆 Лидерборд</button>
  </div>
</div>

<!-- МАГАЗИН -->
<div id="shop" class="panel hidden">
  <div class="panel-head">
    <h3>🛒 Магазин</h3>
    <span class="close" onclick="closePanels()">✖</span>
  </div>

  <button onclick="buy('p1',10)">+1 к тапу — 10</button>
  <button onclick="buy('p2',50)">+2 к тапу — 50</button>
  <button onclick="buyTemp(2,100,30)">x2 на 30 сек — 100</button>
  <button onclick="buyTemp(5,500,60)">x5 на 1 мин — 500</button>
</div>

<!-- ПРОФИЛЬ -->
<div id="profile" class="panel hidden">
  <div class="panel-head">
    <h3>👤 Профиль</h3>
    <span class="close" onclick="closePanels()">✖</span>
  </div>

  <p>ID: <span id="pid"></span></p>
  <p>Монеты: <span id="pCoins"></span></p>
  <p>Сила: <span id="pPower"></span></p>
  <p>Тапов: <span id="pTaps"></span></p>
  <p>Авто: <span id="pAuto"></span></p>
  <p>В игре: <span id="pTime"></span></p>
</div>

<!-- ЛИДЕРБОРД -->
<div id="leader" class="panel hidden">
  <div class="panel-head">
    <h3>🏆 Лидерборд</h3>
    <span class="close" onclick="closePanels()">✖</span>
  </div>

  <p>Скоро…</p>
</div>

<script src="script.js"></script>
</body>
    </html>
