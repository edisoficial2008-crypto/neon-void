<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEON VOID</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
<div id="app">

  <h1>⚡ NEON VOID</h1>

  <div class="stats">
    <div>⚡<span id="energy">0</span></div>
    <div>💎<span id="coins">0</span></div>
    <div>🚀<span id="power">1</span></div>
  </div>

  <!-- КРУГ ТАПА -->
  <div id="tapCircle">TAP</div>

  <!-- НИЖНЕЕ МЕНЮ -->
  <div class="tabs">
    <button data-tab="shop">🛒 Магазин</button>
    <button data-tab="boost">🔥 Бусты</button>
    <button data-tab="profile">👤 Профиль</button>
  </div>

  <!-- ПАНЕЛИ -->
  <div id="shop" class="panel">
    <button id="buyPower">➕ Сила (+1) — 20💎</button>
  </div>

  <div id="boost" class="panel">
    <button id="boostBtn">x2 TAP (30 сек) — 30💎</button>
    <p id="boostTimer"></p>
  </div>

  <div id="profile" class="panel">
    <p>Тапы: <span id="taps">0</span></p>
    <p>Время в игре: <span id="time">0</span> сек</p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
