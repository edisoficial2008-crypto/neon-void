<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEON VOID</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #081c2f, #000);
  color: white;
  text-align: center;
}

h1 {
  margin-top: 20px;
  letter-spacing: 3px;
}

.stats {
  margin: 10px 0;
  font-size: 18px;
}

button {
  margin: 5px;
  padding: 10px 18px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
}

#tap {
  margin: 40px auto;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  background: radial-gradient(circle, #4fc3ff, #0a2a3f);
  box-shadow: 0 0 60px #4fc3ff;
}

.panel {
  margin: 20px auto;
  max-width: 300px;
  padding: 15px;
  background: rgba(0,0,0,.6);
  border-radius: 15px;
}
</style>
</head>

<body>

<h1>NEON VOID</h1>

<div class="stats">
  💰 <span id="score">0</span>
  ⚡ <span id="energy">100/100</span>
</div>

<div>
  <button onclick="openShop()">🛒 Магазин</button>
  <button onclick="openProfile()">👤 Профиль</button>
  <button onclick="openLeaderboard()">🏆 Лидерборд</button>
</div>

<div id="tap"></div>

<div id="panel" class="panel" style="display:none"></div>

<script>
const SERVER_URL = "https://neon-void-2.onrender.com";

/* ===== СОХРАНЕНИЕ ===== */
let score = Number(localStorage.getItem("score")) || 0;
let energy = Number(localStorage.getItem("energy")) || 100;
let maxEnergy = Number(localStorage.getItem("maxEnergy")) || 100;
let name = localStorage.getItem("name") || "Player";

function save() {
  localStorage.setItem("score", score);
  localStorage.setItem("energy", energy);
  localStorage.setItem("maxEnergy", maxEnergy);
  localStorage.setItem("name", name);
}

function updateUI() {
  scoreEl.innerText = score;
  energyEl.innerText = `${energy}/${maxEnergy}`;
}

const scoreEl = document.getElementById("score");
const energyEl = document.getElementById("energy");

/* ===== ТАП ===== */
document.getElementById("tap").onclick = () => {
  if (energy <= 0) return;
  score++;
  energy--;
  save();
  updateUI();
};

/* ===== РЕГЕН ===== */
setInterval(() => {
  if (energy < maxEnergy) {
    energy++;
    save();
    updateUI();
  }
}, 3000);

/* ===== СЕРВЕР ===== */
async function sendScore() {
  try {
    await fetch(SERVER_URL + "/submit", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ name, score })
    });
  } catch {}
}
setInterval(sendScore, 10000);

/* ===== МЕНЮ ===== */
const panel = document.getElementById("panel");

function openShop() {
  panel.style.display = "block";
  panel.innerHTML = `
    <h3>Магазин</h3>
    <button onclick="buyEnergy()">+50 энергии (500)</button>
  `;
}

function buyEnergy() {
  if (score >= 500) {
    score -= 500;
    maxEnergy += 50;
    energy = maxEnergy;
    save();
    updateUI();
    alert("Куплено!");
  }
}

function openProfile() {
  panel.style.display = "block";
  panel.innerHTML = `
    <h3>Профиль</h3>
    <input id="nick" placeholder="Ник" value="${name}">
    <button onclick="saveNick()">Сохранить</button>
  `;
}

function saveNick() {
  name = document.getElementById("nick").value || "Player";
  save();
}

async function openLeaderboard() {
  panel.style.display = "block";
  panel.innerHTML = "Загрузка...";
  try {
    const r = await fetch(SERVER_URL + "/top");
    const d = await r.json();
    panel.innerHTML = "<h3>Лидерборд</h3>" +
      d.map((p,i)=>`${i+1}. ${p.name} — ${p.score}`).join("<br>");
  } catch {
    panel.innerText = "Сервер недоступен";
  }
}

updateUI();
</script>
</body>
</html>
