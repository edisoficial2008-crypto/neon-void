<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NEON VOID</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
html, body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  background:#0b0f1a;
  color:white;
  font-family:Arial, sans-serif;
  text-align:center;
  overflow:hidden;
}

/* -------- HEADER -------- */
.header{
  font-size:28px;
  margin:10px;
  letter-spacing:2px;
}

/* -------- STATS -------- */
.stats{
  display:flex;
  justify-content:center;
  gap:20px;
  margin:10px;
}

/* -------- BUTTONS -------- */
button{
  padding:10px 15px;
  border:none;
  border-radius:20px;
  cursor:pointer;
}

/* -------- TAP CIRCLE (ЧИСТЫЙ — БЕЗ КВАДРАТА) -------- */
.circle{
  width:240px;
  height:240px;
  border-radius:50%;
  background: radial-gradient(circle, #4fc3ff, #0a2a3f);
  margin:20px auto;
  box-shadow:0 0 30px #4fc3ff;
  cursor:pointer;
}

/* -------- PANELS -------- */
.panel{
  display:none;
  background:#111;
  padding:15px;
  margin:10px auto;
  width:90%;
  border-radius:12px;
  text-align:left;
}

/* Крестик закрытия */
.close{
  color:red;
  float:right;
  font-size:20px;
  cursor:pointer;
}

/* Fullscreen button */
.fullscreen{
  position:fixed;
  top:10px;
  right:10px;
}
</style>
</head>

<body>

<button class="fullscreen" onclick="goFull()">📺 Fullscreen</button>

<div class="header">NEON VOID</div>

<div class="stats">
  <div>💰 <span id="score">0</span></div>
  <div>⚡ <span id="energy">100</span>/<span id="maxE">100</span></div>
</div>

<button onclick="openShop()">🛒 Магазин</button>
<button onclick="openProfile()">👤 Профиль</button>
<button onclick="openLeaders()">🏆 Лидерборд</button>

<div class="circle" onclick="tap()"></div>

<!-- МАГАЗИН -->
<div id="shop" class="panel">
  <span class="close" onclick="closeAll()">✖</span>
  <h3>Магазин (долгий прогресс)</h3>

  <button onclick="buy('Energy I', 500, 20)">⚡ Energy I — 500</button><br><br>
  <button onclick="buy('Energy II', 2000, 40)">⚡ Energy II — 2000</button><br><br>
  <button onclick="buy('Energy III', 8000, 80)">⚡ Energy III — 8000</button><br><br>
  <button onclick="buy('Energy IV', 20000, 150)">⚡ Energy IV — 20000</button><br><br>
  <button onclick="buy('Energy V', 50000, 300)">⚡ Energy V — 50000</button><br><br>
  <button onclick="buy('Legend Core', 250000, 600)">💎 Legend Core — 250000</button>
</div>

<!-- ПРОФИЛЬ -->
<div id="profile" class="panel">
  <span class="close" onclick="closeAll()">✖</span>
  <h3>Твой профиль</h3>
  <div id="profileData"></div>
  <br>
  <button onclick="resetLocal()">🔄 Сброс локальных данных</button>
</div>

<!-- ЛИДЕРБОРД -->
<div id="leaders" class="panel">
  <span class="close" onclick="closeAll()">✖</span>
  <h3>Лидерборд</h3>
  <div id="leaderList">Загрузка...</div>
</div>

<script>
const API = "https://neon-void-2.onrender.com";

let userId = localStorage.getItem("uid") || ("user_"+Math.random());
localStorage.setItem("uid", userId);

let score = Number(localStorage.getItem("score")||0);
let energy = Number(localStorage.getItem("energy")||100);
let maxEnergy = Number(localStorage.getItem("maxEnergy")||100);

document.getElementById("score").innerText = score;
document.getElementById("energy").innerText = energy;
document.getElementById("maxE").innerText = maxEnergy;

/* ===== ТАП ===== */
function tap(){
  if(energy <= 0) return;

  score++;
  energy--;

  saveLocal();
  sendToServer();
  updateUI();
}

/* ===== СОХРАНЕНИЕ ===== */
function saveLocal(){
  localStorage.setItem("score", score);
  localStorage.setItem("energy", energy);
  localStorage.setItem("maxEnergy", maxEnergy);
}

function updateUI(){
  document.getElementById("score").innerText = score;
  document.getElementById("energy").innerText = energy;
  document.getElementById("maxE").innerText = maxEnergy;
}

/* ===== ОФЛАЙН РЕГЕН ===== */
setInterval(()=>{
  if(energy < maxEnergy){
    energy++;
    saveLocal();
    updateUI();
  }
}, 30000); // +1 каждые 30 сек

function sendToServer(){
  fetch(API+"/submit",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      userId,
      username:"Player",
      score,
      energy
    })
  });
}

/* ===== ПОКУПКА ===== */
function buy(name, price, bonus){
  if(score < price){
    alert("Недостаточно монет!");
    return;
  }

  fetch(API+"/buy",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      userId,
      item:name,
      price:price,
      maxEnergyBonus:bonus
    })
  })
  .then(r=>r.json())
  .then(d=>{
    if(!d.ok){
      alert(d.msg);
      return;
    }

    score = d.newScore;
    maxEnergy = d.newMax;
    energy = maxEnergy;
    saveLocal();
    updateUI();
    alert("Куплено: "+name);
  });
}

/* ===== ПАНЕЛИ ===== */
function closeAll(){
  document.getElementById("shop").style.display="none";
  document.getElementById("profile").style.display="none";
  document.getElementById("leaders").style.display="none";
}

function openShop(){
  closeAll();
  document.getElementById("shop").style.display="block";
}

function openProfile(){
  closeAll();
  document.getElementById("profile").style.display="block";

  fetch(API+"/profile/"+userId)
    .then(r=>r.json())
    .then(d=>{
      document.getElementById("profileData").innerHTML = `
        👤 Ник: ${d.username}<br>
        💰 Очки: ${d.score}<br>
        ⚡ Энергия: ${d.energy}/${d.maxEnergy}<br>
        🏆 Место: #${d.rank}<br><br>
        🔥 Бусты:<br> ${d.boosts.join("<br>") || "Нет"}
      `;
    });
}

function openLeaders(){
  closeAll();
  document.getElementById("leaders").style.display="block";

  fetch(API+"/top")
    .then(r=>r.json())
    .then(list=>{
      let html="";
      list.forEach((p,i)=>{
        html += `<b>#${i+1}</b> ${p.username} — ${p.score} 💰<br>`;
      });
      document.getElementById("leaderList").innerHTML = html || "Пусто";
    });
}

/* ===== FULLSCREEN (ИСПРАВЛЕННЫЙ) ===== */
function goFull(){
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.msRequestFullscreen) el.msRequestFullscreen();
}

/* ===== СБРОС (если нужно) ===== */
function resetLocal(){
  localStorage.clear();
  location.reload();
}
</script>

</body>
</html>
