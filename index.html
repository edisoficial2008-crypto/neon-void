<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON VOID — Energy Game</title>

<style>
* { box-sizing: border-box; font-family: system-ui, sans-serif; }

body {
  margin: 0;
  background: radial-gradient(circle at center, #0b1b3a, #020512);
  color: #fff;
  overflow: hidden;
}

.header {
  padding: 14px;
  text-align: center;
  background: rgba(0,0,0,.45);
}

.stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  font-size: 18px;
}

.nav {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 10px;
}

.nav button {
  background: #fff;
  border: none;
  border-radius: 14px;
  padding: 10px 18px;
  font-size: 16px;
  cursor: pointer;
}

.tap-zone {
  height: calc(100vh - 200px);
  display: flex;
  justify-content: center;
  align-items: center;
}

.tap-circle {
  width: 240px;
  height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #5ff6ff, #007bff);
  box-shadow: 0 0 30px #4cf, 0 0 80px #06f;
  cursor: pointer;
  transition: transform .08s ease;
}

.tap-circle:active { transform: scale(0.94); }

.float {
  position: absolute;
  color: #8ff;
  font-size: 22px;
  font-weight: 600;
  animation: float 1s ease-out forwards;
  pointer-events: none;
}

@keyframes float {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(-60px); }
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.88);
  display: none;
  padding: 20px;
  overflow-y: auto;
}

.modal-content {
  max-width: 500px;
  margin: auto;
}

.close { font-size: 28px; cursor: pointer; margin-bottom: 10px; }

.shop-item {
  background: rgba(255,255,255,.08);
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 12px;
}

.shop-item button {
  margin-top: 8px;
  width: 100%;
  padding: 10px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="header">
  <h2>NEON VOID</h2>
  <div class="stats">
    <div>💰 <span id="coins">0</span></div>
    <div>⚡ <span id="energy">4000</span>/4000</div>
  </div>
</div>

<div class="nav">
  <button onclick="openModal('shop')">🛒 Магазин</button>
  <button onclick="openModal('profile')">👤 Профиль</button>
  <button onclick="openModal('leader')">🏆 Лидерборд</button>
</div>

<div class="tap-zone">
  <div class="tap-circle" onclick="tap(event)"></div>
</div>

<!-- SHOP -->
<div class="modal" id="shop">
  <div class="modal-content">
    <div class="close" onclick="closeModal()">✕</div>
    <h2>Магазин</h2>

    <div class="shop-item">
      +1 к тапу — 500
      <button onclick="buyTap(1,500)">Купить</button>
    </div>

    <div class="shop-item">
      +5 к тапу — 5000
      <button onclick="buyTap(5,5000)">Купить</button>
    </div>

    <div class="shop-item">
      Макс энергия +1000 — 15000
      <button onclick="buyEnergy()">Купить</button>
    </div>
  </div>
</div>

<!-- PROFILE -->
<div class="modal" id="profile">
  <div class="modal-content">
    <div class="close" onclick="closeModal()">✕</div>
    <h2>Профиль</h2>
    <p>Очки: <span id="pCoins"></span></p>
    <p>Сила тапа: <span id="pTap"></span></p>
    <p>Макс энергия: <span id="pMax"></span></p>
  </div>
</div>

<!-- LEADER -->
<div class="modal" id="leader">
  <div class="modal-content">
    <div class="close" onclick="closeModal()">✕</div>
    <h2>Лидерборд</h2>
    <p>Скоро онлайн</p>
  </div>
</div>

<script>
/* ===== LOAD ===== */
let data = JSON.parse(localStorage.getItem("neon_void")) || {
  coins: 0,
  energy: 4000,
  maxEnergy: 4000,
  tapPower: 1
};

let { coins, energy, maxEnergy, tapPower } = data;

/* ===== SAVE ===== */
function save() {
  localStorage.setItem("neon_void", JSON.stringify({
    coins, energy, maxEnergy, tapPower
  }));
}

/* ===== TAP ===== */
function tap(e) {
  if (energy <= 0) return;
  coins += tapPower;
  energy--;
  spawnFloat(e);
  update();
  save();
}

/* ===== UI ===== */
function spawnFloat(e) {
  const f = document.createElement("div");
  f.className = "float";
  f.innerText = "+" + tapPower;
  f.style.left = e.clientX + "px";
  f.style.top = e.clientY + "px";
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1000);
}

function update() {
  coinsEl.textContent = coins;
  energyEl.textContent = energy;
  pCoins.textContent = coins;
  pTap.textContent = tapPower;
  pMax.textContent = maxEnergy;
}

/* ===== SHOP ===== */
function buyTap(p, price) {
  if (coins >= price) {
    coins -= price;
    tapPower += p;
    update();
    save();
  }
}

function buyEnergy() {
  if (coins >= 15000) {
    coins -= 15000;
    maxEnergy += 1000;
    energy = maxEnergy;
    update();
    save();
  }
}

/* ===== MODALS ===== */
function openModal(id) {
  document.getElementById(id).style.display = "block";
}
function closeModal() {
  document.querySelectorAll(".modal").forEach(m => m.style.display = "none");
}

/* ===== INIT ===== */
const coinsEl = document.getElementById("coins");
const energyEl = document.getElementById("energy");
const pCoins = document.getElementById("pCoins");
const pTap = document.getElementById("pTap");
const pMax = document.getElementById("pMax");

update();
</script>

</body>
</html>
