<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON VOID</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
}

body {
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at center, #6a00ff 0%, #1a001f 70%);
  height: 100vh;
  color: white;
  overflow: hidden;
}

header {
  text-align: center;
  padding: 20px 10px 10px;
}

header h1 {
  font-weight: 700;
  letter-spacing: 2px;
}

header p {
  opacity: 0.85;
  margin-top: 6px;
}

#tap-area {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 240px;
  height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, #c700ff 0%, #6a00ff 60%, transparent 70%);
  box-shadow: 0 0 80px #b000ff;
}

#tap-area:active {
  transform: translate(-50%, -50%) scale(0.96);
}

.tap-number {
  position: absolute;
  font-weight: 700;
  font-size: 20px;
  color: #ffffff;
  pointer-events: none;
  animation: floatUp 0.9s ease-out forwards;
}

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-40px); }
}

/* Нижнее меню */
nav {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 60px;
  background: rgba(0,0,0,0.35);
  display: flex;
  justify-content: space-around;
  align-items: center;
  backdrop-filter: blur(8px);
}

nav span {
  opacity: 0.7;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <h1>NEON VOID</h1>
  <p>
    Очки: <span id="score">0</span> |
    Энергия: <span id="energy">4000</span>/4000
  </p>
</header>

<div id="tap-area"></div>

<nav>
  <span>🎮 Игра</span>
  <span>🛒 Магазин</span>
  <span>👤 Профиль</span>
  <span>🏆 Топ</span>
</nav>

<script>
let score = 0;
let energy = 4000;
const maxEnergy = 4000;

const scoreEl = document.getElementById('score');
const energyEl = document.getElementById('energy');
const tapArea = document.getElementById('tap-area');

// восстановление энергии
setInterval(() => {
  if (energy < maxEnergy) {
    energy++;
    energyEl.textContent = energy;
  }
}, 450); // ~30 минут до фулла

tapArea.addEventListener('click', (e) => {
  if (energy <= 0) return;

  energy--;
  score++;

  scoreEl.textContent = score;
  energyEl.textContent = energy;

  const num = document.createElement('div');
  num.className = 'tap-number';
  num.textContent = '+1';
  num.style.left = e.clientX + 'px';
  num.style.top = e.clientY + 'px';
  document.body.appendChild(num);

  setTimeout(() => num.remove(), 900);
});
</script>

</body>
</html>
