<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON VOID — Energy Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Comic Sans MS',cursive;}
body{height:100vh;overflow:hidden;color:#fff;background:radial-gradient(circle at center,#7a00ff 0%,#2a0033 60%,#120016 100%);} header{text-align:center;padding:12px 0;} header h1{font-size:26px;letter-spacing:2px;} header p{opacity:.7;}

/* TAP */ #tap-area{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);} #tap-btn{ width:220px;height:220px;border-radius:50%; background:radial-gradient(circle,#ff7bff,#6a00cc); box-shadow:0 0 60px #ff4dff; display:flex;align-items:center;justify-content:center; font-size:36px;cursor:pointer;user-select:none; } #tap-btn:active{transform:scale(.95);}

/* EFFECTS */ .effect{position:absolute;border-radius:50%;border:2px solid #ff7bff;animation:boom .7s ease-out forwards;pointer-events:none;} @keyframes boom{from{width:0;height:0;opacity:1;}to{width:260px;height:260px;opacity:0;}}

/* PANELS */ .panel{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(10,0,20,.95);display:none;padding:20px;} .panel.active{display:block;} .close{position:absolute;top:15px;right:20px;font-size:28px;cursor:pointer;}

/* NAV */ nav{position:absolute;bottom:0;left:0;width:100%;display:flex;justify-content:space-around;padding:10px;background:rgba(0,0,0,.4);} nav div{opacity:.7;cursor:pointer;} nav div.active{opacity:1;}

button{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;}

</style>
</head>
<body>
<header>
  <h1>NEON VOID</h1>
  <p>Очки: <span id="score">0</span> | Энергия: <span id="energy">4000</span>/4000</p>
</header><div id="tap-area">
  <div id="tap-btn">TAP</div>
</div><!-- SHOP --><div id="shop" class="panel">
  <div class="close" onclick="closePanels()">✖</div>
  <h2>🛒 Магазин</h2><br>
  <div>+1 за тап — 50 очков <button onclick="buyTap()">Купить</button></div><br>
  <div>Авто-тап (30 мин) — 300 <button onclick="buyAuto()">Купить</button></div>
</div><!-- PROFILE --><div id="profile" class="panel">
  <div class="close" onclick="closePanels()">✖</div>
  <h2>👤 Профиль</h2><br>
  <p>Очки: <span id="pScore">0</span></p>
  <p>Сила тапа: <span id="pTap">1</span></p>
  <p>Всего тапов: <span id="pTaps">0</span></p>
</div><!-- LEADER --><div id="leader" class="panel">
  <div class="close" onclick="closePanels()">✖</div>
  <h2>🏆 Лидерборд</h2><br>
  <p>1. Ты — <span id="lScore">0</span></p>
</div><nav>
  <div onclick="openPanel('shop')">🛒</div>
  <div onclick="openPanel('profile')">👤</div>
  <div onclick="openPanel('leader')">🏆</div>
</nav><script>
let score=0, tapPower=1, energy=4000, taps=0;

function update(){
  score+=tapPower; taps++; energy--;
  document.getElementById('score').textContent=score;
  document.getElementById('energy').textContent=energy;
  document.getElementById('pScore').textContent=score;
  document.getElementById('pTap').textContent=tapPower;
  document.getElementById('pTaps').textContent=taps;
  document.getElementById('lScore').textContent=score;
}

const tapBtn=document.getElementById('tap-btn');

tapBtn.onclick=(e)=>{
  if(energy<=0) return;
  update();
  const ef=document.createElement('div');
  ef.className='effect';
  ef.style.left=e.clientX-130+'px';
  ef.style.top=e.clientY-130+'px';
  document.body.appendChild(ef);
  setTimeout(()=>ef.remove(),700);
}

function buyTap(){if(score>=50){score-=50;tapPower++;}}
function buyAuto(){alert('Автотап в разработке');}

function openPanel(id){closePanels();document.getElementById(id).classList.add('active');}
function closePanels(){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));}

// ENERGY REGEN
setInterval(()=>{if(energy<4000) energy+=Math.ceil(4000/1800);},1000);
</script></body>
</html>
