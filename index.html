<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEON VOID — Energy Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;font-family:Arial}
body{
  margin:0;
  background:#000;
  color:#fff;
  overflow:hidden;
}
.bg{
  position:fixed;
  inset:0;
  background:url("https://images.wallpapersden.com/image/download/anime-girl-cyberpunk-neon_bmdtbGaUmZqaraWkpJRmZW1lrWdtbWU.jpg") center/cover no-repeat;
  filter:brightness(.4);
  z-index:0;
}
#app{position:relative;z-index:1;height:100vh;width:100vw}

.top{
  display:flex;
  justify-content:space-around;
  padding:10px;
  font-size:16px;
}

.tap-zone{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:220px;
  height:220px;
  border-radius:50%;
  background:radial-gradient(circle,#00ffe7,#003);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  cursor:pointer;
  user-select:none;
}

.bottom{
  position:absolute;
  bottom:15px;
  width:100%;
  display:flex;
  justify-content:space-around;
}
.btn{
  background:#111;
  padding:12px 18px;
  border-radius:14px;
  cursor:pointer;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  z-index:5;
}
.modal-content{
  background:#111;
  margin:40px;
  padding:20px;
  border-radius:16px;
  max-height:80vh;
  overflow:auto;
}
.close{
  position:absolute;
  top:10px;
  right:15px;
  font-size:22px;
  cursor:pointer;
}

.shop-item{
  background:#1a1a1a;
  margin:10px 0;
  padding:12px;
  border-radius:12px;
}

.privacy{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}
.privacy-box{
  background:#111;
  padding:25px;
  border-radius:16px;
  text-align:center;
}
.privacy button{
  margin-top:15px;
  padding:10px 20px;
  border-radius:12px;
  border:none;
}
</style>
</head>

<body>
<div class="bg"></div>

<div class="privacy" id="privacy">
  <div class="privacy-box">
    <h2>🔒 Конфиденциальность</h2>
    <p>Прогресс сохраняется</p>
    <button onclick="acceptPrivacy()">Принять</button>
  </div>
</div>

<div id="app">
  <div class="top">
    <div>💰 <span id="coins">0</span></div>
    <div>⚡ <span id="power">1</span></div>
  </div>

  <div class="tap-zone" onclick="tap()">TAP</div>

  <div class="bottom">
    <div class="btn" onclick="openModal('shop')">🛒 Магазин</div>
    <div class="btn" onclick="openModal('profile')">👤 Профиль</div>
    <div class="btn" onclick="openModal('leaderboard')">🏆 Лидерборд</div>
  </div>
</div>

<!-- МАГАЗИН -->
<div class="modal" id="shop">
  <div class="modal-content">
    <div class="close" onclick="closeModal()">✖</div>
    <h2>🛒 Магазин</h2>

    <div class="shop-item">
      ⚡ +1 сила — 50 монет
      <button onclick="buyPower(1,50)">Купить</button>
    </div>

    <div class="shop-item">
      ⚡ +5 сила — 200 монет
      <button onclick="buyPower(5,200)">Купить</button>
    </div>

    <div class="shop-item">
      ⏳ x2 доход (5 мин) — 150 монет
      <button onclick="buyBoost()">Купить</button>
    </div>
  </div>
</div>

<!-- ПРОФИЛЬ -->
<div class="modal" id="profile">
  <div class="modal-content">
    <div class="close" onclick="closeModal()">✖</div>
    <h2>👤 Профиль</h2>
    <p>ID: <span id="pid"></span></p>
    <p>Тапов: <span id="taps"></span></p>
    <p>Сила: <span id="ppower"></span></p>
    <p>Монет: <span id="pcoins"></span></p>
  </div>
</div>

<!-- ЛИДЕРБОРД -->
<div class="modal" id="leaderboard">
  <div class="modal-content">
    <div class="close" onclick="closeModal()">✖</div>
    <h2>🏆 Лидерборд</h2>
    <p>1. Ты — <span id="lcoins"></span> 💰</p>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let data = JSON.parse(localStorage.getItem("neon")) || {
  coins:0,
  power:1,
  taps:0,
  boostEnd:0
};

function save(){localStorage.setItem("neon",JSON.stringify(data))}

function update(){
  coins.innerText=data.coins;
  power.innerText=data.power;
  taps.innerText=data.taps;
  ppower.innerText=data.power;
  pcoins.innerText=data.coins;
  lcoins.innerText=data.coins;
  pid.innerText=tg.initDataUnsafe?.user?.id || "local";
}

function tap(){
  let mult = Date.now()<data.boostEnd?2:1;
  data.coins += data.power*mult;
  data.taps++;
  save();update();
}

function buyPower(p,c){
  if(data.coins>=c){
    data.coins-=c;
    data.power+=p;
    save();update();
  }
}

function buyBoost(){
  if(data.coins>=150){
    data.coins-=150;
    data.boostEnd=Date.now()+5*60*1000;
    save();update();
  }
}

function openModal(id){document.getElementById(id).style.display="block";}
function closeModal(){document.querySelectorAll(".modal").forEach(m=>m.style.display="none");}

function acceptPrivacy(){
  localStorage.setItem("privacy","1");
  privacy.style.display="none";
}
if(localStorage.getItem("privacy")=="1") privacy.style.display="none";

update();
</script>
</body>
</html>
